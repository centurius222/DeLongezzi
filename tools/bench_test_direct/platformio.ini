; Standalone bench test project — no GaggiMate code, only PSM.
; Build/flash:  pio run -d bench_test_direct -e bench -t upload
[env:bench]
platform = espressif32@6.12.0
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    PSM=https://github.com/gaggimate/PSM.Library.git
