; XIAO ESP32-S3 acting as a real BLE scale peripheral (WeighMyBru protocol)
; Replaces the flaky PC BlueZ simulator so the machine is tested against a
; genuine BLE GATT peripheral.
;
; Touch pads (capacitive, no ground bridge needed):
;   D3 (GPIO4)  -> start/stop pour
;   D8 (GPIO7)  -> tare
;
; Advertises as "WeighMyBru-Sim" (matches weighmybru plugin: name starts with
; "WeighMyBru"), Nordic UART service, 20-byte weight frames at 10 Hz — the same
; protocol the PC sim used.
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0