; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 2026-10-22 (build 969): a plain `pio run` (or VS Code's Build button) builds only this board;
; the other envs are GaggiMate's own hardware and PC tests.
[platformio]
default_envs = delongezzi-single

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
check_flags = 
	cppcheck: --enable=all --inline-suppr --suppress=*:*/.pio/*
monitor_filters =
    esp32_exception_decoder
    time
    default

[display_common]
build_flags =
    -std=c++17
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN
    -O2
    -DCONFIG_MAX_FILENAME_LEN=64
    -DCONFIG_MAX_URL_LEN=128
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    ; Run AsyncTCP on core 0, same core as the WiFi MAC and LWIP tcpip thread.
    ; Driving LWIP from a different core than the WiFi/RX path (core 1) risks
    ; cross-core LWIP races under load that wedge the whole IP stack (web + ICMP
    ; die together). v1.8.1 used core 0 and was stable; the BLE load that
    ; originally motivated moving it off core 0 is now much lower (idle 30-50ms
    ; connection interval + fire-and-forget telemetry).
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    ; web server task: used ~3.7 KB of 8 KB (measured 2026-10-09), trimmed to free fast memory
    -DCONFIG_ASYNC_TCP_STACK_SIZE=6144
    ; Websocket client cap. cleanupClients() evicts the OLDEST client when a new
    ; one pushes past this (AsyncWebSocket.cpp:872-875), so a cap below the
    ; number of browsers actually left open produces permanent eviction churn —
    ; each reconnect kicks another tab, and a UI with no status stream reports
    ; the scale as disconnected and hides its controls. 3 was reached by a phone,
    ; a laptop and a desktop, which is an ordinary way to use this machine.
    -DDEFAULT_MAX_WS_CLIENTS=6
lib_deps_default =
    ; 2026-10-22 (build 969): exact versions, the ones built and tested (were ^ = "this or newer")
    adafruit/Adafruit MAX31865 library@1.6.2
    adafruit/Adafruit NeoPixel@1.15.5
    FS
    SPIFFS
    LittleFS
    Wire
    SPI
    ble_ota_dfu
    NanoPbComm
    ; NimBLE-Arduino 1.4.3: kept in lib/NimBLE-Arduino with the PSRAM host settings (nimconfig.h)
    nanopb/Nanopb@0.4.92
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.9
    ; ESPAsyncWebServer v3.9.1: kept in lib/ESPAsyncWebServer with a client-list lock
    bblanchon/ArduinoJson@7.4.3
    256dpi/MQTT@2.5.3
    ; esp-arduino-ble-scales v1.0.2: kept in lib/esp-arduino-ble-scales with a scan-list lock
    homespan/HomeSpan@1.9.1
    ; Improv WiFi Library 0.0.4: kept in lib/ImprovWiFi with a parser fix (the command after a
    ; successful one was dropped, 2026-10-23, build 970)

[env:display]
board = LilyGo-T-RGB
board_build.filesystem = littlefs
upload_speed = 921600
build_src_filter = -<*> +<display/> +<version.h>
extra_scripts =
	pre:scripts/auto_firmware_version.py
	; Ensures src/display/webassets/* (embedded web UI) exists before compile;
	; stubs an empty bundle if build_webui.sh hasn't been run. [GM-106]
	pre:scripts/embed_webui_pre.py
; nanopb's official PlatformIO integration generates gaggimate.pb.{c,h} from the
; .proto at build time (no committed generated files, no separate generator
; script). The matching gaggimate.options is picked up automatically.
custom_nanopb_protos =
	+<lib/NanoPbComm/proto/gaggimate.proto>
custom_nanopb_options =
	--error-on-unmatched
lib_deps =
    ${display_common.lib_deps_default}
    lewisxhe/SensorLib @ 0.2.3
    bodmer/TFT_eSPI @ 2.5.43
	lvgl/lvgl @ 8.4.0
	moononournation/GFX Library for Arduino @ 1.5.9
build_flags =
    ${display_common.build_flags}

[env:display-headless]
extends = env:display
lib_deps =
    ${display_common.lib_deps_default}
build_flags =
    ${display_common.build_flags}
    -DGAGGIMATE_HEADLESS
build_src_filter = -<*> +<display/> +<version.h> -<display/drivers/> -<display/ui/> -<display/lv_conf.h>

[env:display-headless-8m]
extends = env:display-headless
board = seeed_xiao_esp32s3

; De'longezzi single-board build: display half + controller half in one image,
; linked by an in-process loopback transport instead of BLE (see
; lib/NanoPbComm/src/ble/LoopbackPair.h and pins.txt merge plan).
[env:delongezzi-single]
extends = env:display-headless-8m
; The board is an N16R8: use all 16 MB, one 4 MB app (no OTA, flashed by
; cable) and ~11.9 MB LittleFS instead of the 8 MB default layout (2026-09-24).
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_16mb.csv
; 2026-10-22 (build 967): USB logging off (user). The inherited levels are removed here: the old
; -UCORE_DEBUG_LEVEL landed after every -D on the compiler line and left the board default (1),
; and the Bluetooth library printed its own warnings with printf (to the USB console) at level 2.
build_unflags =
    ${env.build_unflags}
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
build_flags =
    ${env:display-headless-8m.build_flags}
    -DGAGGIMATE_MERGED
    ; 2026-10-16: serial prints errors only (was 3 = info, from display_common). Info lines such
    ; as "WS final frame" were printed to USB from the web server task on every message.
    ; 2026-10-22 (build 967): 0 = nothing at all (user: USB logging off).
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    ; 2026-10-10: BLE re-enabled for the scale, with the NimBLE host moved to PSRAM (nimconfig.h)
    ; to claw back internal RAM. The zero-window fix and 16/8 buffers stay.
    ; -DDELONGEZZI_NO_BLE=1
lib_deps =
    ${env:display-headless-8m.lib_deps}
    GaggiMateController

[env:controller]
board = Gaggimate-Controller
build_src_filter = -<*> +<controller/> +<version.h>
extra_scripts =
    pre:scripts/auto_firmware_version.py
custom_nanopb_protos =
	+<lib/NanoPbComm/proto/gaggimate.proto>
custom_nanopb_options =
	--error-on-unmatched
lib_deps =
	GaggiMateController
	FS
	SPIFFS
	ble_ota_dfu
	NanoPbComm
	nanopb/Nanopb@0.4.92
	bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=c++17
    -std=gnu++17
	-DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

; Native-host env for Autotune SIMC unit tests. Autotune.cpp = STL-only, so
; `pio test -e native_autotune` runs host-side, no ESP32/Arduino runtime.
; Unity framework shipped with PlatformIO.
[env:native_autotune]
platform = native
framework =
lib_ldf_mode = off
lib_deps =
	throwtheswitch/Unity@^2.6.0
test_framework = unity
test_filter = test_autotune_simc
; Test TU includes Autotune.cpp directly (see #include at top of
; test_autotune_simc.cpp) — native linker skips NayrodPID's Arduino-dependent
; siblings (SimplePID, SimpleKalmanFilter, ...).
build_unflags =
	-std=gnu++11
build_flags =
	-std=c++17
	-I lib/NayrodPID/src
	-Wno-unused-variable
	-Wno-unused-function

; Desktop simulator: builds the real display firmware natively with the BLE link
; to the controller mocked (sim/comms) and an SDL window as the panel (sim/driver).
; All host shims for Arduino/ESP/FreeRTOS/FS/Preferences/WiFi live in sim/platform.
; Requires SDL2 on the host (macOS: `brew install sdl2`). See sim/README.md. [GM-107]
[env:display-sim]
platform = native
framework =
lib_ldf_mode = off
; Adds a clickable "Run Simulator" task (pio run -e display-sim -t run).
extra_scripts = post:scripts/sim_run.py
build_src_filter =
	-<*>
	+<display/>
	+<version.h>
	+<../sim/>
	-<display/main.cpp>
	-<display/drivers/>
	-<display/webassets/>
	-<display/plugins/MQTTPlugin.cpp>
	-<display/plugins/HomekitPlugin.cpp>
	-<display/plugins/mDNSPlugin.cpp>
	-<display/plugins/NetworkWatchdogPlugin.cpp>
	-<display/plugins/WifiStaWatchdogPlugin.cpp>
	-<display/plugins/BLEScalePlugin.cpp>
	-<display/plugins/WeighMyBruTimerScales.cpp>
	-<display/plugins/ImprovPlugin.cpp>
lib_deps =
	lvgl/lvgl@8.4.0
	bblanchon/ArduinoJson@^7.2.1
build_unflags =
	-std=gnu++11
build_flags =
	-DGAGGIMATE_SIM
	-std=gnu++17
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DCORE_DEBUG_LEVEL=0
	; Make ArduinoJson auto-configure exactly as on the device (Arduino String,
	; no std::string) so its overload resolution matches the firmware.
	-DARDUINO=10812
	; Path to the embedded WebUI blob, .incbin'd by sim/web/web_ui_blob_sim.S.
	-DGM_WEB_UI_BIN=\"${PROJECT_DIR}/src/display/webassets/web_ui.bin\"
	-I ${PROJECT_DIR}/sim/platform
	-I ${PROJECT_DIR}/sim/platform/arduino
	-I ${PROJECT_DIR}/sim/comms
	-I ${PROJECT_DIR}/sim/driver
	-I ${PROJECT_DIR}/sim/web
	-I ${PROJECT_DIR}/src
	!sdl2-config --cflags
	!sdl2-config --libs
